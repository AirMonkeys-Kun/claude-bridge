# Claude Bridge Configuration v8
# Config sources (priority high→low): env vars → config.yaml → code defaults
#
# Env vars:
#   XIAOMI_API_KEY / ZHIPU_API_KEY    API Key for the provider
#   PROVIDER                           Active provider name ("xiaomi" | "zhipu")
#   PROXY_HOST                         Bind host (default: 127.0.0.1)
#   PROXY_PORT                         Bind port (default: 4000)
#   API_FORMAT                         Override api_format ("anthropic" | "openai")
#
# api_format:
#   "anthropic" — Native passthrough. Sends the original Anthropic Messages body
#                 (with mapped model name) to the backend's /v1/messages endpoint.
#                 Preserves thinking blocks, tool_use, etc. natively.
#   "openai"    — Format conversion. Converts Anthropic Messages → OpenAI Chat
#                 Completions before sending; converts responses back.
#                 Discards reasoning_content to avoid mixing with text_delta.

provider: "xiaomi"

xiaomi:
  api_format: "anthropic"
  # For anthropic passthrough mode: api_base_anthropic + /v1/messages
  api_base_anthropic: "https://token-plan-cn.xiaomimimo.com/anthropic/v1"
  # For openai conversion mode: api_base + /chat/completions
  api_base: "https://token-plan-cn.xiaomimimo.com/v1"
  api_key: "tp-ccmi9f3bj16fr3odclqjkgt3o8hsr3u11dkphnpm1eozwdxd"
  model_map:
    # Current Claude Desktop model names (2025+)
    "claude-sonnet-4-20250514": "mimo-v2.5-pro"
    "claude-opus-4-20250514": "mimo-v2.5-pro"
    "claude-haiku-4-20250514": "mimo-v2.5"
    # Short names
    "claude-sonnet-4-6": "mimo-v2.5-pro"
    "claude-opus-4-7": "mimo-v2.5-pro"
    "claude-haiku-4-6": "mimo-v2.5"
    "claude-haiku-4-5": "mimo-v2.5"
    # 3.5 series
    "claude-3-5-sonnet-20241022": "mimo-v2.5"
    "claude-3-5-haiku-20241022": "mimo-v2.5"
    "claude-3-5-sonnet-20240620": "mimo-v2.5"
    # Role-level fallbacks
    "claude-sonnet": "mimo-v2.5-pro"
    "claude-opus": "mimo-v2.5-pro"
    "claude-haiku": "mimo-v2.5"

zhipu:
  api_format: "openai"
  api_base: "https://open.bigmodel.cn/api/coding/paas/v4"
  api_key: "8d0c2e734cb442ea9b30608444bc239c.HaJ7Avl3y90hWUA2"
  model_map:
    "claude-sonnet-4-20250514": "glm-5.1"
    "claude-opus-4-20250514": "glm-5.1"
    "claude-haiku-4-20250514": "glm-5.1"
    "claude-sonnet-4-6": "glm-5.1"
    "claude-opus-4-7": "glm-5.1"
    "claude-haiku-4-6": "glm-5.1"
    "claude-sonnet": "glm-5.1"
    "claude-opus": "glm-5.1"
    "claude-haiku": "glm-5.1"

# Failover / Circuit Breaker
# When enabled, providers are tried in order upon failure (5xx / network errors).
# Each provider gets its own circuit breaker: after `failure_threshold` consecutive
# failures the circuit opens; after `cooldown_seconds` it becomes half-open and
# allows a probe request.
failover:
  enabled: true
  failure_threshold: 3
  cooldown_seconds: 30
  providers:
    - "xiaomi"
    - "zhipu"

# Smart model routing
# Routes specific model patterns to designated providers.
# The matched provider becomes first in the failover chain for that request.
# If the routed provider is unavailable, failover still works as normal.
routing:
  enabled: true
  rules:
    # Haiku / legacy models -> zhipu (cheaper)
    - pattern: "claude-haiku-*"
      provider: "zhipu"
    - pattern: "claude-3-5-*"
      provider: "zhipu"
    - pattern: "claude-haiku"
      provider: "zhipu"
    # Sonnet / Opus -> xiaomi (premium)
    - pattern: "claude-sonnet-*"
      provider: "xiaomi"
    - pattern: "claude-opus-*"
      provider: "xiaomi"
    - pattern: "claude-sonnet"
      provider: "xiaomi"
    - pattern: "claude-opus"
      provider: "xiaomi"

server:
  host: "127.0.0.1"
  port: 4000
